name: Deploy Frontend and Backend

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ${{ github.repository }}/frontend
  BACKEND_IMAGE: ${{ github.repository }}/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=https://eezz.ad/api

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host droplet
            HostName ${{ secrets.DROPLET_IP }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      - name: Deploy to Droplet
        run: |
          # Create deployment script
          cat > deploy_commands.sh << 'EOF'
          #!/bin/bash
          set -e

          # Login to container registry
          echo "$1" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull the latest images
          docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

          # Setup application directory
          mkdir -p ~/unravel
          cd ~/unravel

          # Create docker-compose.yml
          cat > docker-compose.yml << 'INNEREOF'
          version: '3.8'

          services:
            frontend:
              image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
              ports:
                - '3000:3000'
              restart: always
              environment:
                - VITE_API_URL=http://localhost:8000

            backend:
              image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
              ports:
                - '8000:8000'
              restart: always
              environment:
                - DJANGO_SETTINGS_MODULE=config.settings
                - PYTHONUNBUFFERED=1
                - DATABASE_URL=${{ secrets.DATABASE_URL }}
                - ALLOWED_HOSTS=eezz.ad,localhost,127.0.0.1
                - CORS_ALLOWED_ORIGINS=https://eezz.ad,http://localhost:3000,http://localhost:5173
                - CSRF_TRUSTED_ORIGINS=https://eezz.ad
                - DEBUG=False
                - GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
                - GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
                - GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
                - POSTMARK_SERVER_TOKEN=${{ secrets.POSTMARK_SERVER_TOKEN }}
                - DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
                - FRONTEND_URL=https://eezz.ad
                - GHL_API_TOKEN=${{ secrets.GHL_API_TOKEN }}
                - GHL_LOCATION_ID=${{ secrets.GHL_LOCATION_ID }}
                - stripeProdKey=${{ secrets.STRIPE_PROD_KEY }}
                - stripeProdSecretKey=${{ secrets.STRIPE_PROD_SECRET_KEY }}
                - STRIPE_PRICE_ID=${{ secrets.STRIPE_PRICE_ID }}
                - STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
                - FB_APP_ID=${{ secrets.FB_APP_ID }}
                - FB_APP_SECRET=${{ secrets.FB_APP_SECRET }}
                - FRONTEND_URL=${{ secrets.FRONTEND_URL }}
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - media_files:/app/media

            qcluster:
              image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
              command: python manage.py qcluster
              restart: always
              environment:
                - DJANGO_SETTINGS_MODULE=config.settings
                - PYTHONUNBUFFERED=1
                - DATABASE_URL=${{ secrets.DATABASE_URL }}
                - DEBUG=False
                - GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
                - POSTMARK_SERVER_TOKEN=${{ secrets.POSTMARK_SERVER_TOKEN }}
                - DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
                - FRONTEND_URL=https://eezz.ad
              depends_on:
                - backend
              extra_hosts:
                - "host.docker.internal:host-gateway"

          volumes:
            media_files:
          INNEREOF

          # Deploy
          docker-compose down || true
          docker-compose pull
          docker-compose up -d

          # Cleanup
          docker system prune -af --volumes
          EOF

          # Copy script to server and execute
          chmod +x deploy_commands.sh
          scp -F ~/.ssh/config deploy_commands.sh droplet:~/
          ssh -F ~/.ssh/config droplet "bash ~/deploy_commands.sh '${{ secrets.PAT }}'"
